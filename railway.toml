[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npx prisma generate && npm run build"

[build.nixpacksPlan.phases.setup]
nixPkgs = ["openssl"]

[deploy]
startCommand = "npx prisma migrate deploy && echo '=== INICIANDO NODE ===' && node dist/main 2>&1 || echo '=== NODE FALHOU CODIGO '$?==="
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
